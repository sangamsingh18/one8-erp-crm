  <circle cx="86" cy="302" r="22" fill="#3B82F6" />
  
  <!-- Bottom-right node -->
  <line x1="380" y1="270" x2="410" y2="288" stroke="#3B82F6" stroke-width="14" stroke-linecap="round"/>
